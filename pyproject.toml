[project]
name = "taller-03-opcional-alvarez-ballesteros-ludena"
version = "0.1.0"
description = "Taller 03 v2 MMIA 6013 - Solver multiagente con GraphRAG: del enunciado en PDF al reporte medido"
readme = "README.md"
authors = [
    { name = "akroasis0301", email = "miguel.alvrz.n@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- LLM y orquestacion ---
    "openai>=1.40",              # cliente compatible con el vLLM de la H200 (y con la clave del curso)
    "langgraph==1.2.12",         # version fijada por el laboratorio
    "httpx>=0.27",               # embeddings bge-m3 en el Ollama de la H200 (/api/embed)
    "python-dotenv>=1.0",
    "pydantic>=2.7",             # esquemas: plan, subtareas, veredicto del critico
    # --- Lector (PDF -> texto + tablas) ---
    "pdfplumber>=0.11",
    "pypdf>=4.0",                # tambien cuenta paginas del entregable PDF
    # --- Indexador (GraphRAG) ---
    "networkx>=3.3",             # grafo, ciclos del plan y comunidades (louvain)
    # --- Lo que importan los scripts que corre el sandbox ---
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    # --- Redactor: notebook ejecutado y PDF ---
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "markdown>=3.6",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# PDF escaneado: OCR con docling (pesado: trae torch). Solo si una tarea real lo necesita.
ocr = ["docling>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solver"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
